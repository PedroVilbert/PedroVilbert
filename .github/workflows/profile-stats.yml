
name: Atualizar conquistas do perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar pasta de conquistas
        run: mkdir -p assets

      - name: Gerar conquistas do GitHub
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=PedroVilbert&theme=tokyonight&column=6&margin-w=10&margin-h=10&no-frame=true"
          path: assets/trophies.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Salvar arquivo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          git diff --cached --quiet || git commit -m "Atualiza conquistas do perfil"
          git push
